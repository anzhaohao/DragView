name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node:
          - 22.19.0
          - 24.x

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Verify committed build output
        run: git diff --exit-code -- src/client.js src/index.js src/file-access.js src/side-chat-bridge.js src/fingerprint.js src/client-fingerprint.js src/client-export-bridge.js src/client/rail-fixture.js src/client/preview-fixture.js
      - run: npm run check
      - run: npm test
      - run: npm pack --dry-run
